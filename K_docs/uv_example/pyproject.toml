[project]
name = "uv-example"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = ["numpy>=2.2.5", "pandas>=2.2.3", "sub0"]

[tool.uv.sources]
# The workspace = true key-value pair in the tool.uv.sources table indicates the sub0 dependency should be provided by the workspace, rather than fetched from PyPI or another registry.
sub0 = { workspace = true }

# 根目录project.toml中
# workspace所有项目共享uv.lock文件
# workspace只有一个.venv文件夹
# workspace每个项目都有自己的pyproject.toml文件
# uv lock:对整个workspace进行操作
# uv sync:安装根目录依赖到.venv(此时uv pip list显示主项目已安装的包)
# uv sync --package sub0:安装子项目sub0依赖到.venv(此时uv pip list显示子项目sub0已安装的包)
[tool.uv.workspace]
members = ["sub0", "sub1"]

# Unlike optional dependencies, development dependencies are local-only and will not be included in the project requirements when published to PyPI or other indexes. 
[dependency-groups]
dev = [
    "ipykernel>=7.2.0",
    "jupyter>=1.1.1",
    { include-group = "pytest" }, # 把另一个依赖组的内容包含进来
]
test = ["pytest>=8", "pytest-cov"]
lint = ["ruff"]

# By default, uv includes the dev dependency group in the environment
# The default groups to include can be changed using the tool.uv.default-groups setting.
[tool.uv]
default-groups = ["dev", "lint"]
